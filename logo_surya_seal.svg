  <circle cx="60" cy="60" r="17.5" stroke="url(#surya-gold)" stroke-width="2.2" fill="none" />
  <circle cx="60" cy="60" r="13.0" fill="url(#surya-core)" stroke="#F5D77F" stroke-width="1.5" />
  <circle cx="60" cy="60" r="9.0" stroke="#8E6C25" stroke-width="1.0" fill="none" opacity="0.6" />
