  <polygon points="60.00,60.00 79.22,63.30 118.00,60.00" fill="#7A5A1B" stroke="#684A12" stroke-width="0.5" />
  <polygon points="60.00,60.00 40.78,63.30 2.00,60.00" fill="url(#surya-light)" stroke="#D4A548" stroke-width="0.5" />
  <polygon points="60.00,60.00 40.78,56.70 2.00,60.00" fill="#7A5A1B" stroke="#684A12" stroke-width="0.5" />

