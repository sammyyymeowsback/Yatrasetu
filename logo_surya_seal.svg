  <polygon points="60.00,60.00 56.70,40.78 60.00,2.00" fill="url(#surya-light)" stroke="#D4A548" stroke-width="0.5" />
  <polygon points="60.00,60.00 63.30,40.78 60.00,2.00" fill="#7A5A1B" stroke="#684A12" stroke-width="0.5" />
