<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="surya-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="45%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8E6C25" />
    </linearGradient>
    <linearGradient id="surya-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="100%" stop-color="#D4A548" />
    </linearGradient>
    <radialGradient id="surya-core" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF6DE" />
      <stop offset="40%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#7A5A1B" />
    </radialGradient>
  </defs>

