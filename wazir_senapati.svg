<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%">
  <defs>
    <linearGradient id="card-stock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="50%" stop-color="#F7F3EA"/>
      <stop offset="100%" stop-color="#EFE9DC"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFB76C"/>
      <stop offset="35%" stop-color="#F3E1B2"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C7836"/>
    </linearGradient>
    <pattern id="jaali-pat" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none" stroke="#C5A059" stroke-width="0.5" opacity="0.4"/>
      <circle cx="3" cy="3" r="1" fill="#C5A059" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Card Stock -->
  <rect x="2" y="2" width="316" height="476" rx="16" ry="16" fill="url(#card-stock)" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="8" y="8" width="304" height="464" rx="12" ry="12" fill="none" stroke="url(#gold-foil)" stroke-width="1.2"/>
  <rect x="22" y="22" width="276" height="436" rx="8" ry="8" fill="none" stroke="#222" stroke-width="0.9" stroke-dasharray="6,2"/>

  <!-- Corner Brackets -->
  <path d="M 28 42 L 28 28 L 42 28" fill="none" stroke="#C5A059" stroke-width="1.8"/>
  <path d="M 292 42 L 292 28 L 278 28" fill="none" stroke="#C5A059" stroke-width="1.8"/>
  <path d="M 28 438 L 28 452 L 42 452" fill="none" stroke="#C5A059" stroke-width="1.8"/>
  <path d="M 292 438 L 292 452 L 278 452" fill="none" stroke="#C5A059" stroke-width="1.8"/>

  
    <!-- Top-Left Pip -->
    <g class="corner-pip" transform="translate(24, 38)">
      <text x="0" y="0" font-family="'Cinzel', 'Times New Roman', serif" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">J</text>
      <text x="0" y="22" font-family="serif" font-size="20" fill="#1A1A1A" text-anchor="middle">♠</text>
    </g>
    <!-- Bottom-Right Pip (Inverted) -->
    <g class="corner-pip" transform="translate(296, 442) rotate(180)">
      <text x="0" y="0" font-family="'Cinzel', 'Times New Roman', serif" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">J</text>
      <text x="0" y="22" font-family="serif" font-size="20" fill="#1A1A1A" text-anchor="middle">♠</text>
    </g>
    
  
    <g transform="translate(14, 240) rotate(-90)">
      <text x="0" y="0" font-family="'Cinzel', 'Times New Roman', serif" font-size="8.5" font-weight="700" letter-spacing="2.5" fill="#555" text-anchor="middle">❖ CHANDRAGUPTA MAURYA ❖</text>
    </g>
    <g transform="translate(306, 240) rotate(90)">
      <text x="0" y="0" font-family="'Cinzel', 'Times New Roman', serif" font-size="8.5" font-weight="700" letter-spacing="2.5" fill="#555" text-anchor="middle">❖ CHANDRAGUPTA MAURYA ❖</text>
    </g>
    

  <!-- Canvas Inset -->
  <rect x="42" y="32" width="236" height="416" rx="4" ry="4" fill="none" stroke="#222" stroke-width="1.2"/>
  <rect x="44" y="34" width="232" height="412" rx="3" ry="3" fill="none" stroke="#C5A059" stroke-width="0.6"/>

  
    
    <g id="senapati-half">
      <circle cx="160" cy="116" r="42" fill="#FAF6EE" stroke="#C5A059" stroke-width="1.2"/>
      <circle cx="160" cy="116" r="38" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="2,2"/>
      <path d="M 110 236 L 115 182 Q 125 160 144 156 L 176 156 Q 195 160 205 182 L 210 236 Z" fill="#F5EFE6" stroke="#222" stroke-width="1.6"/>
      <rect x="151" y="142" width="18" height="16" fill="#FDFBF7" stroke="#222" stroke-width="1.2"/>
      <path d="M 149 116 Q 149 144 160 148 Q 171 144 171 116 Q 171 105 160 105 Q 149 105 149 116 Z" fill="#FFFDF9" stroke="#222" stroke-width="1.4"/>
      <ellipse cx="155" cy="122" rx="2.2" ry="1.4" fill="#1A1A1A"/>
      <ellipse cx="165" cy="122" rx="2.2" ry="1.4" fill="#1A1A1A"/>
      <path d="M 153 133 Q 160 131 167 133 Q 171 135 169 137 Q 160 134 151 137 Z" fill="#1A1A1A"/>
      <path d="M 147 108 L 145 84 Q 160 76 175 84 L 173 108 Z" fill="#FAF3E0" stroke="#222" stroke-width="1.4"/>
      <!-- Royal Sword & Shield -->
      <g transform="translate(68, 55)">
        <line x1="20" y1="0" x2="20" y2="180" stroke="#222" stroke-width="3"/>
        <line x1="21" y1="0" x2="21" y2="180" stroke="#C5A059" stroke-width="1.5"/>
        <polygon points="20,0 14,24 26,24" fill="#C5A059" stroke="#222" stroke-width="1"/>
      </g>
      <g transform="translate(80, 175)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#FDFBF7" stroke="#222" stroke-width="1.2"/>
      </g>
    </g>
    
    <g transform="translate(42, 232)">
      <rect x="0" y="0" width="236" height="16" fill="#FAF6EE" stroke="#222" stroke-width="1.4"/>
      <rect x="2" y="2" width="232" height="12" fill="url(#jaali-pat)"/>
      <circle cx="118" cy="8" r="7" fill="#C5A059" stroke="#222" stroke-width="1"/>
      <text x="118" y="11" font-family="serif" font-size="9" font-weight="700" fill="#1A1A1A" text-anchor="middle">♠</text>
    </g>
    <use href="#senapati-half" transform="translate(320, 480) rotate(180)"/>
    
</svg>