      <path d="M 148 116 Q 148 144 160 148 Q 172 144 172 116 Q 172 104 160 104 Q 148 104 148 116 Z" fill="#FFFDF9" stroke="#222" stroke-width="1.4"/>
      <ellipse cx="155" cy="122" rx="2" ry="1.2" fill="#222"/>
      <ellipse cx="165" cy="122" rx="2" ry="1.2" fill="#222"/>
      <path d="M 152 133 Q 160 130 160 133 Q 160 130 168 133 Q 175 133 173 137 Q 164 135 160 135 Q 156 135 147 137 Z" fill="#1A1A1A"/>
      <path d="M 154 137 Q 160 148 166 137 Z" fill="#1A1A1A"/>
      <path d="M 157 114 Q 160 111 163 114 Q 160 113 157 114 Z" fill="#C8102E"/>
      <path d="M 142 110 Q 138 88 152 80 Q 160 76 172 82 Q 182 92 178 110 Z" fill="#FAF3E0" stroke="#222" stroke-width="1.5"/>
      <path d="M 145 98 Q 160 92 175 98" stroke="#E25822" stroke-width="2"/>
      <circle cx="150" cy="80" r="3" fill="#C8102E" stroke="#222" stroke-width="0.7"/>
      <!-- Bhavani Talwar -->
      <g transform="translate(68, 55)">
        <path d="M 20 0 Q 16 90 28 180" fill="none" stroke="#222" stroke-width="3"/>
        <circle cx="20" cy="172" r="5" fill="#C5A059" stroke="#222" stroke-width="1"/>
      </g>
      <g transform="translate(80, 175)">
        <rect x="0" y="0" width="16" height="18" rx="4" fill="#FDFBF7" stroke="#222" stroke-width="1.2"/>
        <rect x="-2" y="16" width="20" height="6" rx="2" fill="#E25822" stroke="#222" stroke-width="0.8"/>
      </g>
    </g>
    
    <g transform="translate(42, 232)">
      <rect x="0" y="0" width="236" height="16" fill="#FAF6EE" stroke="#222" stroke-width="1.4"/>
      <rect x="2" y="2" width="232" height="12" fill="url(#jaali-pat)"/>
      <circle cx="118" cy="8" r="7" fill="#C8102E" stroke="#222" stroke-width="1"/>
      <text x="118" y="11" font-family="serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">♥</text>
    </g>
    <use href="#shivaji-half" transform="translate(320, 480) rotate(180)"/>
    
